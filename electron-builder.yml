appId: com.nodeforge.app
productName: NodeForge
copyright: Copyright © 2026 NodeForge Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}.${ext}

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
  installerHeaderIcon: build/icon.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NodeForge
